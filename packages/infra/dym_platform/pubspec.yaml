name: dym_platform
description: Services de la plateforme pour les apps DYM (stockage sécurisé, photos, puis push et géolocalisation).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  audioplayers: ^6.5.1
  cached_network_image: ^4.0.6
  dym_core: ^0.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.5.0
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.0
  livekit_client: ^2.13.2
  meta: ^1.17.0
  mobile_scanner: ^7.5.0
  neon_kit: ^0.1.0
  qr_flutter: ^4.1.0
  record: ^7.1.2
  sentry: 10.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
