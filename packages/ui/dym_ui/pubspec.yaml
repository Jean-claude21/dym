name: dym_ui
description: Design system DYM « Le marché de Lomé, livré chez toi » (thème, polices, composants).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  dym_core:
    path: ../../foundation/dym_core
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito[wght].ttf
    - family: NunitoSans
      fonts:
        - asset: fonts/NunitoSans[YTLC,opsz,wdth,wght].ttf
