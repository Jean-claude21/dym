name: dym_ui
description: Design system DYM « Épuré » (thème, police Inter, composants).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  dym_core:
    path: ../../foundation/dym_core
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  lottie: ^3.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/aisles/
    - assets/brand/
    - assets/origins/
    - assets/scenes/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter[opsz,wght].ttf
