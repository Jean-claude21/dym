name: dym_gallery
description: Galerie de validation du design system DYM (outil interne, non publié).
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  dym_account: ^0.1.0
  dym_admin: ^0.1.0
  dym_auth: ^0.1.0
  dym_chat: ^0.1.0
  dym_client: ^0.1.0
  dym_core:
    path: ../../packages/foundation/dym_core
  dym_data: ^0.1.0
  dym_l10n: ^0.1.0
  dym_models: ^0.1.0
  dym_platform: ^0.1.0
  dym_ui:
    path: ../../packages/ui/dym_ui
  # Écrans de la boutique (spec 006) : la galerie, outil interne non publié,
  # affiche les vrais écrans de l'app vendeuse.
  dym_vendor: ^0.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/demo/products/
    - assets/demo/aisles/
    - assets/demo/people/
    - assets/demo/stores/
    - assets/demo/illustrations/
    - assets/reference/
