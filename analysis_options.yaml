include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/build/**"
    - "**/.dart_tool/**"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # Les apps et la galerie ne sont pas des API publiques ; la documentation des composants
    # dym_ui est exigée en revue (research R9).
    public_member_api_docs: false
