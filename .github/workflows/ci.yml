name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Version de Flutter lue dans .fvmrc (source de vérité, décision 0006).
      - name: Lire la version Flutter
        id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true

      # Melos utilise sdkPath: .fvm/flutter_sdk ; en CI on y lie le SDK installé.
      - name: Lier le SDK pour Melos
        run: |
          mkdir -p .fvm
          ln -sfn "$(dirname "$(dirname "$(which flutter)")")" .fvm/flutter_sdk

      - name: Dépendances
        run: |
          flutter pub get
          dart run melos bootstrap

      - name: Thème à jour avec les tokens
        run: dart run melos run tokens:check

      - name: Analyse
        run: dart run melos run analyze

      - name: Tests Dart (dym_core)
        run: dart run melos run test:dart

      - name: Tests Flutter (hors golden)
        run: dart run melos run test

  database:
    name: Base (migrations + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # PostgreSQL 17 et pgTAP du dépôt PGDG, installés sur le runner (pas de conteneur).
      - name: PostgreSQL 17 + pgTAP
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17 postgresql-17-pgtap
          sudo pg_ctlcluster 17 main start
          PORT=$(pg_lsclusters -h | awk '$1 == "17" { print $3 }')
          sudo -u postgres psql -p "$PORT" -c "alter user postgres password 'postgres'"
          sudo -u postgres createdb -p "$PORT" dym
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:$PORT/dym" >> "$GITHUB_ENV"

      # Les imitations Neon (rôles Data API, auth.uid, neon_auth.user) ne sont
      # appliquées qu'ici et en local, jamais sur Neon.
      - name: Migrations
        run: node db/scripts/dym-db.mjs migrate --neon-shims

      - name: Migrations idempotentes
        run: node db/scripts/dym-db.mjs migrate

      - name: Tests pgTAP
        run: node db/scripts/dym-db.mjs test

  functions:
    name: Functions (typage + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
